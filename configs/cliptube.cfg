[mediaserver]
ytdlpbin = /home/chris/bin/yt-dlp

[gnomeclipindicator]
histfile = ~/.cache/clipboard-indicator@tudmotu.com/registry.txt
sleeptime = 5

[clipboard]
# gnome preserves extension-history polling; auto prefers Wayland, then X11.
backend = gnome
# clipboard | primary | both (ignored by the GNOME history backend)
selection = clipboard
# Live clipboard polling interval, including event-backend fallback.
sleeptime = 1
# Retention of completed downloads only; pending and failed entries are retained.
historydays = 365

[bbc]
enabled = true
pvrdir = /mnt/nas/docker/get_iplayer/config/.get_iplayer/pvr
